# ============================================
# Campus Complaint Tracker - Application Config
# ============================================

# Server
server.port=8080

# H2 Database Config (Default for instant execution without MySQL)
spring.datasource.url=jdbc:h2:mem:complaint_tracker_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Datasource Config (Uncomment to use MySQL instead of H2)
# spring.datasource.url=jdbc:mysql://localhost:3306/complaint_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable schema.sql auto-execution (Hibernate + DataSeeder handles database initialization)
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=Y2FtcHVzLWNvbXBsYWludC10cmFja2VyLXNlY3JldC1rZXktMjAyNC1wcm9kdWN0aW9uLXJlYWR5LXNwcmluZy1ib290LWp3dC1zaWduaW5nLWtleQ==
app.jwt.expiration-ms=86400000

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Mail Configuration (configure for email notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=false

# Logging
logging.level.com.campus.complaint=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Upload (for complaint images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Seed Data
app.seed.enabled=true
